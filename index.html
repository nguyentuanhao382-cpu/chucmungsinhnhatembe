<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chúc Em Sinh Nhật Vui Vẻ🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./style/style.css">
</head>
<body>

<button id="mode-toggle" title="Chuyển đổi chế độ sáng/tối">🌙</button>
<button id="music-btn" title="Phát/tạm dừng nhạc nền">🔇</button>

<div class="container">
  <h1>Chúc Em Sinh Nhật Vui Vẻ🎂</h1>
  <img src="images/anhdep3.jpg" alt="Avatar" class="avatar" />

  <h1>Đặng Thị Thùy Trang💖</h1>

  <div>
    <button class="btn" id="open-gift-btn" aria-haspopup="dialog" aria-controls="popup" aria-expanded="false">Em mở ra xem lẹ đi</button>
    <button class="btn" id="exit-btn" aria-haspopup="dialog">Chọn cái này nè😂</button>
  </div>
</div>

<div class="popup" id="exit-popup" role="alertdialog" aria-modal="true">
  <center><img src="images/anhdep1.jpg" alt="Xin lỗi mà"/></center>
  <h2>Em lại bị dụ nữa rùiii</h2>
  <p>thoát ra đi </p>
  <button class="close-btn" id="close-exit-btn">hẹ hẹ hẹ😁</button>
</div>

<div class="popup" id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title" aria-describedby="popup-desc">
  <center><img src="./images/anhdep2.jpg" alt="Quà sinh nhật" /></center>
  <h2 id="popup-title">Bất ngờ chưa!</h2>
  <div id="typing-text" aria-live="polite" aria-atomic="true"></div>
  <button class="close-btn" id="close-popup-btn">Đóng</button>
</div>
<canvas id="fireworks"></canvas>

<audio id="bg-music" autoplay loop>
  <source src="./style/HPBD.mp3" type="audio/mpeg" />
</audio>

<div class="popup" id="guess-age-popup">
  <center><img src="images/anhdep4.jpg" alt="Guess age" style="width: 120px;"/></center>
  <h2>Khai tuổi thật đi 🤨</h2>
  <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
    <button class="btn age-btn" data-age="16">19 tuổi</button>
    <button class="btn age-btn" data-age="17">20 tuổi</button>
    <button class="btn age-btn" data-age="18">21 tuổi</button>
  </div>
</div>
<script src="./style/script.js"></script>
</body>
</html>
